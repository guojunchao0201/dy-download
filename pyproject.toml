[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-archiver"
version = "0.1.0"
description = "Local, maintainable Douyin profile archiver powered by F2"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

